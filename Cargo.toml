[package]
name = "lancer-dnsx"
version = "0.1.0"
edition = "2021"
description = "Rust clone of dnsx — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-dnsx"

[lib]
name = "lancer_dnsx"
path = "src/lib.rs"

[[bin]]
name = "lancer-dnsx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-channel = "2"
hickory-resolver = { version = "0.24", features = [
    "dns-over-https-rustls",
    "dns-over-tls",
    "webpki-roots",
] }
hickory-client = "0.24"
hickory-proto = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
regex = "1"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dashmap = "6"
redb = "2"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
